<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>监控故障诊断助手 · 块状诊断树 Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='4' fill='%2317365D'/%3E%3Ccircle cx='12' cy='12' r='5' fill='%23fff'/%3E%3Ccircle cx='12' cy='12' r='2.2' fill='%23E8A33D'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0F1B2D; --panel:#15263C; --panel2:#1B3050; --line:#2A4365;
    --txt:#E8F0FA; --txt2:#9FB6CF; --txt3:#6E87A3;
    --blue:#5B9BD5; --green:#4CAF7D; --amber:#E8A33D; --red:#E06A5A;
    --symptom:#5B9BD5; --judge:#6FA8DC; --cause:#E8A33D; --solution:#4CAF7D;
    --radius:10px;
    --header-h:46px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  svg{display:block;}

  /* ===== 顶部栏 ===== */
  header{
    height:var(--header-h); flex:0 0 auto;
    display:flex; align-items:center; gap:10px;
    padding:0 12px;
    background:linear-gradient(180deg,#182B44,#14243C);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:8px; min-width:0;}
  .brand .logo{width:26px;height:26px;border-radius:7px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .brand .t{font-size:15px;font-weight:700;letter-spacing:.3px;white-space:nowrap;}
  .brand .sub{font-size:10px;color:var(--txt3);margin-top:1px;white-space:nowrap;}
  .crumb{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--txt2);min-width:0;overflow:hidden;white-space:nowrap;}
  .crumb b{color:var(--txt);font-weight:600;}
  .crumb .sep{color:var(--txt3);}
  .search{margin-left:auto;display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 8px;height:30px;width:min(38vw,240px);flex:0 0 auto;}
  .search input{background:transparent;border:none;outline:none;color:var(--txt);font-size:13px;width:100%;}
  .search input::placeholder{color:var(--txt3);}
  .legend{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--txt2);flex:0 0 auto;}
  .legend .dot{width:8px;height:8px;border-radius:50%;}
  .lg{display:flex;align-items:center;gap:3px;}

  /* ===== 主区域三栏 ===== */
  main{
    flex:1 1 auto; min-height:0;
    display:grid; grid-template-columns:170px minmax(0,1fr) minmax(0,1.25fr);
    gap:8px; padding:8px;
  }
  .col{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    display:flex; flex-direction:column; min-height:0; overflow:hidden;
  }
  .col-h{
    padding:8px 12px; font-size:11px; font-weight:700; color:var(--txt2);
    letter-spacing:1px; border-bottom:1px solid var(--line); flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
  }
  .col-h .cnt{font-size:10px;color:var(--txt3);font-weight:400;}

  /* 分类栏 */
  .cat-list{flex:1 1 auto;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:6px;}
  .cat{
    display:flex; align-items:center; gap:8px; width:100%;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    padding:7px 9px; cursor:pointer; text-align:left; color:var(--txt);
    transition:border-color .15s, background .15s;
  }
  .cat .no{width:22px;height:22px;border-radius:6px;background:rgba(91,155,213,.18);color:var(--blue);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .cat .nm{font-size:13px;font-weight:600;line-height:1.25;flex:1 1 auto;min-width:0;}
  .cat .n{font-size:10px;color:var(--txt3);flex:0 0 auto;}
  .cat.on{border-color:var(--blue);background:rgba(91,155,213,.14);}
  .cat.on .no{background:var(--blue);color:#0F1B2D;}

  /* 故障栏 */
  .fault-list{flex:1 1 auto;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:6px;}
  .fault{
    display:flex; align-items:flex-start; gap:8px; width:100%;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    padding:8px 9px; cursor:pointer; text-align:left; color:var(--txt);
    transition:border-color .15s, background .15s;
  }
  .fault .pri{width:5px;height:100%;min-height:34px;border-radius:3px;flex:0 0 auto;align-self:stretch;}
  .fault .fbody{flex:1 1 auto;min-width:0;}
  .fault .ft{font-size:13px;font-weight:600;line-height:1.3;}
  .fault .fd{font-size:11px;color:var(--txt2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .fault .ftags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;}
  .fault .tag{font-size:9px;color:var(--txt2);background:rgba(110,135,163,.15);border-radius:4px;padding:1px 5px;}
  .fault.on{border-color:var(--blue);background:rgba(91,155,213,.14);}
  .empty{font-size:12px;color:var(--txt3);padding:20px 12px;text-align:center;}

  /* 详情栏 */
  .detail{flex:1 1 auto;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px;}
  .d-head{}
  .d-title{font-size:16px;font-weight:700;line-height:1.3;}
  .d-desc{font-size:12px;color:var(--txt2);margin-top:3px;line-height:1.5;}
  .d-cond{font-size:11px;color:var(--amber);margin-top:4px;}
  .d-cond b{color:var(--txt3);font-weight:500;}

  .block{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;}
  .block-h{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:7px;}
  .block-h .bar{width:3px;height:12px;border-radius:2px;}
  .judge-list{display:flex;flex-direction:column;gap:6px;}
  .judge{
    display:flex; align-items:flex-start; gap:7px;
    background:rgba(111,168,220,.08); border:1px solid rgba(111,168,220,.25); border-radius:7px;
    padding:6px 8px; font-size:12px; color:var(--txt); line-height:1.45;
  }
  .judge .ic{width:16px;height:16px;border-radius:50%;background:var(--judge);color:#0F1B2D;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px;}
  .cause{
    background:rgba(232,163,61,.06); border:1px solid rgba(232,163,61,.22); border-radius:7px;
    padding:8px 9px; margin-top:6px;
  }
  .cause .ct{font-size:12px;font-weight:700;color:var(--amber);display:flex;align-items:center;gap:5px;}
  .cause .ct .no{width:15px;height:15px;border-radius:4px;background:var(--cause);color:#0F1B2D;font-size:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .cause .cd{font-size:11.5px;color:var(--txt2);margin-top:3px;line-height:1.5;}
  .cause .ck{font-size:11px;color:var(--txt);background:rgba(232,163,61,.1);border-radius:5px;padding:5px 7px;margin-top:5px;line-height:1.45;}
  .cause .ck .lab{color:var(--txt3);}
  .cause .sol{font-size:11.5px;color:var(--solution);background:rgba(76,175,125,.08);border:1px solid rgba(76,175,125,.2);border-radius:5px;padding:5px 7px;margin-top:5px;line-height:1.45;}
  .cause .sol .lab{color:var(--txt3);}
  .d-prev{font-size:11px;color:var(--txt2);background:rgba(110,135,163,.1);border-radius:6px;padding:7px 9px;line-height:1.5;}
  .d-prev b{color:var(--txt);}
  .d-src{font-size:10px;color:var(--txt3);}

  /* 提示页 */
  .hint{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%;color:var(--txt3);font-size:12px;text-align:center;padding:20px;}
  .hint .big{width:44px;height:44px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}

  ::-webkit-scrollbar{width:5px;height:5px;}
  ::-webkit-scrollbar-thumb{background:rgba(110,135,163,.35);border-radius:3px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ===== 手机横板模拟外框 ===== */
  .phone-shell{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;}
  @media (min-width:600px) and (orientation:landscape) and (min-height:400px){
    body{align-items:center;justify-content:center;background:#0A1424;padding:22px;}
    .phone-shell{
      width:min(94vw, 940px);
      height:min(calc(100vh - 44px), 440px);
      border-radius:22px;
      border:1px solid rgba(91,155,213,.25);
      box-shadow:0 24px 70px rgba(0,0,0,.55), 0 0 0 6px rgba(91,155,213,.06);
      overflow:hidden;
    }
  }
  /* 横板下放大字号与格子，便于手机阅读 */
  @media (orientation:landscape) and (max-height:600px){
    .brand .t{font-size:17px;}
    .brand .sub{font-size:12px;}
    .crumb{font-size:13px;}
    .search{height:32px;}
    .search input{font-size:16px;}
    .legend{font-size:12px;}
    .col-h{font-size:12px;}
    .cat{padding:9px 10px;}
    .cat .nm{font-size:15px;}
    .cat .n{font-size:12px;}
    .cat .no{width:26px;height:26px;font-size:13px;}
    .fault{padding:9px 10px;}
    .fault .ft{font-size:15px;}
    .fault .fd{font-size:13px;}
    .fault .tag{font-size:11px;}
    .d-title{font-size:18px;}
    .d-desc{font-size:14px;}
    .d-cond{font-size:13px;}
    .block-h{font-size:12px;}
    .judge{font-size:14px;}
    .cause .ct{font-size:14px;}
    .cause .cd{font-size:13px;}
    .cause .ck{font-size:13px;}
    .cause .sol{font-size:13px;}
    .d-prev{font-size:13px;}
    .d-src{font-size:11px;}
  }

  /* ===== 竖屏降级：三栏堆叠可滚动 ===== */
  @media (orientation: portrait) and (max-width: 720px){
    body{overflow:auto;}
    .phone-shell{height:auto;min-height:100%;overflow:visible;}
    main{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;height:auto;min-height:calc(100vh - var(--header-h));}
    .col{max-height:240px;}
    .col.detail-col{max-height:none;min-height:60vh;}
    .search{width:40vw;}
    .legend{display:none;}
  }
</style>
</head>
<body>
<div class="phone-shell">

<header>
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#0F1B2D" stroke-width="2.4" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22M4.9 4.9l2.5 2.5M16.6 16.6l2.5 2.5M19.1 4.9l-2.5 2.5M7.4 16.6l-2.5 2.5"/>
      </svg>
    </div>
    <div>
      <div class="t">监控故障诊断</div>
      <div class="sub">块状诊断树 Demo</div>
    </div>
  </div>
  <div class="crumb"><b id="crumb">分类 → 故障</b></div>
  <div class="search">
    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#6E87A3" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="searchInput" type="search" placeholder="搜故障，如黑屏 / 卡顿" autocomplete="off">
  </div>
  <div class="legend">
    <span class="lg"><span class="dot" style="background:var(--red)"></span>高</span>
    <span class="lg"><span class="dot" style="background:var(--amber)"></span>中</span>
    <span class="lg"><span class="dot" style="background:var(--txt3)"></span>低</span>
  </div>
</header>

<main>
  <!-- 第一栏：分类 -->
  <section class="col" id="colCat">
    <div class="col-h">故障分类 <span class="cnt" id="catCnt"></span></div>
    <div class="cat-list" id="catList"></div>
  </section>

  <!-- 第二栏：故障现象 -->
  <section class="col" id="colFault">
    <div class="col-h"><span id="faultColTitle">故障现象</span> <span class="cnt" id="faultCnt"></span></div>
    <div class="fault-list" id="faultList"></div>
  </section>

  <!-- 第三栏：诊断详情 -->
  <section class="col detail-col" id="colDetail">
    <div class="col-h">诊断与处理</div>
    <div class="detail" id="detailBox"></div>
  </section>
</main>
</div>

<script>
"use strict";

/* ===== 状态 ===== */
const state = { cat: 0, fault: null, query: "" };

const $ = id => document.getElementById(id);
const PRI_COLOR = { "高": "var(--red)", "中": "var(--amber)", "低": "var(--txt3)" };

/* ===== 渲染：分类 ===== */
function renderCats(){
  const box = $("catList");
  const matched = matchCats();
  box.innerHTML = "";
  FAULT_DATA.categories.forEach((c, i) => {
    if(state.query && !matched.has(c.id)) return;
    const el = document.createElement("button");
    el.className = "cat" + (state.cat === i ? " on" : "");
    el.innerHTML = `<span class="no">${c.order}</span><span class="nm">${c.name}</span><span class="n">${c.faults.length}</span>`;
    el.addEventListener("click", () => { state.cat = i; state.fault = null; renderAll(); });
    box.appendChild(el);
  });
  $("catCnt").textContent = FAULT_DATA.categories.length + " 类";
  if(!box.children.length){
    box.innerHTML = `<div class="empty">无匹配分类<br>换个关键词试试</div>`;
  }
}

function matchCats(){
  const set = new Set();
  if(!state.query) return set;
  FAULT_DATA.categories.forEach(c => {
    const hit = c.faults.some(f =>
      f.title.includes(state.query) || f.tags.some(t => t.includes(state.query)) || f.desc.includes(state.query));
    if(hit) set.add(c.id);
  });
  return set;
}

/* ===== 渲染：故障 ===== */
function renderFaults(){
  const box = $("faultList");
  const cat = FAULT_DATA.categories[state.cat];
  $("faultColTitle").textContent = cat.name;
  let list = cat.faults;
  if(state.query){
    list = cat.faults.filter(f =>
      f.title.includes(state.query) || f.tags.some(t => t.includes(state.query)) || f.desc.includes(state.query));
  }
  box.innerHTML = "";
  $("faultCnt").textContent = list.length + " 条";
  list.forEach(f => {
    const el = document.createElement("button");
    el.className = "fault" + (state.fault === f.id ? " on" : "");
    const tags = f.tags.slice(0, 3).map(t => `<span class="tag">${t}</span>`).join("");
    el.innerHTML = `
      <span class="pri" style="background:${PRI_COLOR[f.priority] || "var(--txt3)"}"></span>
      <span class="fbody">
        <div class="ft">${f.title}</div>
        <div class="fd">${f.desc}</div>
        <div class="ftags">${tags}</div>
      </span>`;
    el.addEventListener("click", () => { state.fault = f.id; renderDetail(); markFault(); });
    box.appendChild(el);
  });
  if(!box.children.length){
    box.innerHTML = `<div class="empty">该分类下无匹配故障</div>`;
  }
}

function markFault(){
  [...$("faultList").children].forEach(el => {
    el.classList.toggle("on", state.fault && el.textContent.includes(state.fault));
  });
}

/* ===== 渲染：详情 ===== */
function renderDetail(){
  const box = $("detailBox");
  const cat = FAULT_DATA.categories[state.cat];
  const f = cat.faults.find(x => x.id === state.fault);
  if(!f){
    box.innerHTML = `
      <div class="hint">
        <div class="big"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#6E87A3" stroke-width="1.8" stroke-linecap="round"><path d="M12 8v5M12 17h.01"/><path d="M10.3 3.9 2.6 17.5a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div>
        <div>选择左侧故障现象<br>查看判断要点、原因与处理</div>
      </div>`;
    $("crumb").innerHTML = `<b>${cat.name}</b><span class="sep">→</span><span>选择故障</span>`;
    return;
  }
  $("crumb").innerHTML = `<b>${cat.name}</b><span class="sep">→</span><b>${f.title}</b>`;

  const pri = f.priority ? `<span style="color:${PRI_COLOR[f.priority]};font-weight:700">【${f.priority}优先级】</span> ` : "";
  const judges = f.judges.map((j, i) =>
    `<div class="judge"><span class="ic">${i + 1}</span><span>${j.title}</span></div>`).join("");

  const causes = f.causes.map((c, i) => {
    const checks = (c.checks || []).map(x => x).join("；");
    return `
      <div class="cause">
        <div class="ct"><span class="no">${i + 1}</span>${c.title}</div>
        <div class="cd">${c.desc}</div>
        ${checks ? `<div class="ck"><span class="lab">排查：</span>${checks}</div>` : ""}
        <div class="sol"><span class="lab">处理：</span>${c.solution}</div>
      </div>`;
  }).join("");

  const prev = f.prevention ? `<div class="d-prev"><b>预防：</b>${f.prevention}</div>` : "";
  const src = f.source_note ? `<div class="d-src">参考：${f.source_note}</div>` : "";

  box.innerHTML = `
    <div class="d-head">
      <div class="d-title">${pri}${f.title}</div>
      <div class="d-desc">${f.desc}</div>
      <div class="d-cond"><b>触发条件</b> ${f.condition || "—"}</div>
    </div>
    <div class="block">
      <div class="block-h"><span class="bar" style="background:var(--judge)"></span>判断要点 · 先做这几步</div>
      <div class="judge-list">${judges}</div>
    </div>
    <div class="block">
      <div class="block-h"><span class="bar" style="background:var(--cause)"></span>可能原因 → 排查 → 处理</div>
      ${causes}
    </div>
    ${prev}
    ${src}`;
}

/* ===== 搜索 ===== */
$("searchInput").addEventListener("input", e => {
  state.query = e.target.value.trim();
  state.fault = null;
  renderCats();
  renderFaults();
  renderDetail();
});

/* ===== 初始化 ===== */
function renderAll(){
  renderCats();
  renderFaults();
  renderDetail();
}
renderAll();
</script>
