<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具箱 · 把小事交给小工具</title>
<style>
  :root {
    --bg: #E7F2EB;
    --card: #FFFFFF;
    --ink: #085041;
    --ink-2: #5F5E5A;
    --ink-3: #888780;
    --accent: #0F6E56;
    --accent-light: #1D9E75;
    --border: #D5E6DB;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 32px; }

  /* 导航 */
  header { padding: 26px 0; }
  .nav { display: flex; align-items: center; justify-content: space-between; }
  .brand { font-size: 17px; font-weight: 600; color: var(--ink); text-decoration: none; letter-spacing: 1px; }
  .brand::after { content: "."; color: var(--accent-light); }
  .nav-links { display: flex; gap: 28px; font-size: 14px; }
  .nav-links a { color: var(--ink-2); text-decoration: none; transition: color .15s; }
  .nav-links a:hover { color: var(--ink); }
  .nav-links a.active { color: var(--ink); border-bottom: 2px solid var(--accent); padding-bottom: 3px; }

  /* 首页 hero */
  .hero { padding: 56px 0 48px; }
  .hero h1 { font-size: clamp(34px, 5vw, 52px); font-weight: 600; line-height: 1.3; letter-spacing: 1px; }
  .hero p { font-size: 16px; color: var(--ink-2); margin-top: 14px; }
  .hero .meta { display: inline-flex; gap: 8px; align-items: center; margin-top: 18px; font-size: 13px; color: var(--accent); background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 6px 16px; }
  .hero .meta i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-light); display: inline-block; }

  /* 工具网格 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; padding-bottom: 64px; }
  .tool-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px 24px;
    cursor: pointer;
    transition: transform .18s, border-color .18s;
    display: block;
    text-decoration: none;
  }
  .tool-card:hover { transform: translateY(-4px); border-color: var(--accent-light); }
  .tool-card .cat { font-size: 12px; font-weight: 600; color: var(--accent-light); letter-spacing: 1px; margin-bottom: 12px; }
  .tool-card .name { font-size: 19px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .tool-card .desc { font-size: 13px; color: var(--ink-3); }
  .tool-card.all { background: var(--accent); border-color: var(--accent); display: flex; align-items: center; justify-content: space-between; }
  .tool-card.all .name { color: #fff; }
  .tool-card.all .arrow { font-size: 22px; color: #fff; }

  /* 工具页 */
  .tool-page { padding: 24px 0 64px; flex: 1; }
  .back { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2); text-decoration: none; margin-bottom: 28px; transition: color .15s; }
  .back:hover { color: var(--ink); }
  .tool-head { margin-bottom: 32px; }
  .tool-head .cat { font-size: 13px; font-weight: 600; color: var(--accent-light); letter-spacing: 1px; }
  .tool-head h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 600; margin-top: 8px; letter-spacing: 1px; }
  .tool-head p { font-size: 15px; color: var(--ink-2); margin-top: 10px; max-width: 560px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 48px 32px; text-align: center; }
  .panel .icon { width: 52px; height: 52px; border-radius: 14px; background: var(--bg); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
  .panel h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  .panel p { font-size: 14px; color: var(--ink-3); }

  /* 关于页 */
  .about { padding: 24px 0 64px; flex: 1; }
  .about h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 600; margin-bottom: 16px; letter-spacing: 1px; }
  .about p { font-size: 15px; color: var(--ink-2); max-width: 620px; margin-bottom: 12px; }

  footer { border-top: 1px solid var(--border); padding: 22px 0; font-size: 13px; color: var(--ink-3); }
  footer .wrap { display: flex; justify-content: space-between; }

  @media (max-width: 560px) {
    .wrap { padding: 0 20px; }
    .hero { padding: 36px 0 32px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="#/">工具箱</a>
    <nav class="nav-links">
      <a href="#/" data-nav="home">首页</a>
      <a href="#/about" data-nav="about">关于</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <span>工具箱 · 本地运行，数据不上传</span>
    <span>自研小工具集合</span>
  </div>
</footer>

<script>
  const TOOLS = [
    { id: "cam", name: "监控故障诊断助手", cat: "监控运维", desc: "症状排查诊断树，快速定位摄像头故障", link: "01cam/" },
    { id: "qrcode", name: "二维码生成", cat: "效率工具", desc: "把文本、链接批量生成二维码", link: "03QRCODE/" },
    { id: "json", name: "JSON 格式化", cat: "文本处理", desc: "美化、校验与压缩，支持超长文本" },
    { id: "doc-diff", name: "文档对比", cat: "文本处理", desc: "两版文本逐行对比，差异高亮" },
    { id: "watermark", name: "水印工具", cat: "图片工具", desc: "图片加文字水印，平铺或单枚" },
    { id: "weekly", name: "周报工具", cat: "办公效率", desc: "按日记录，一键生成周报" },
    { id: "wordgame", name: "bananagame", cat: "游戏", desc: "拼字母游戏", link: "04wordgame/"  },
    { id: "regex", name: "正则测试器", cat: "开发辅助", desc: "实时匹配高亮，常用表达式收藏" },
    { id: "timestamp", name: "时间戳转换", cat: "开发辅助", desc: "Unix 时间戳与日期互转" }
  ];

  const ICONS = {
    text: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F6E56" stroke-width="1.8"><path d="M4 7 H20 M4 12 H20 M4 17 H13"/></svg>',
    image: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F6E56" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 17 L9 12 L14 16 L18 13 L21 16"/></svg>',
    dev: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F6E56" stroke-width="1.8"><path d="M8 6 L3 12 L8 18 M16 6 L21 12 L16 18"/></svg>',
    work: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F6E56" stroke-width="1.8"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10 H21 M9 5 V3 H15 V5"/></svg>',
    misc: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F6E56" stroke-width="1.8"><path d="M5 4 H19 V8 L14 13 V19 L10 21 V13 L5 8 Z"/></svg>'
  };
  const CAT_ICON = { "文本处理": "text", "图片工具": "image", "开发辅助": "dev", "办公效率": "work", "效率工具": "misc" };

  const app = document.getElementById("app");

  function toolCard(t) {
    const href = t.link ? t.link : `#/tool/${t.id}`;
    const badge = t.link ? `<span style="display:inline-block;font-size:11px;font-weight:600;color:#fff;background:var(--accent-light);border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:middle;">可用</span>` : "";
    return `<a class="tool-card" href="${href}">
      <div class="cat">${t.cat}</div>
      <div class="name">${t.name}${badge}</div>
      <div class="desc">${t.desc}</div>
    </a>`;
  }

  function renderHome() {
    app.innerHTML = `
      <div class="wrap">
        <section class="hero">
          <h1>把小事<br>交给小工具。</h1>
          <p>自己开发、自己使用的效率工具集合</p>
          <span class="meta"><i></i>${TOOLS.length} 个工具 · 全部本地运行 · 无需登录</span>
        </section>
        <section class="grid">
          ${TOOLS.map(toolCard).join("")}
          <a class="tool-card all" href="#/about">
            <span class="name">关于本站</span>
            <span class="arrow">→</span>
          </a>
        </section>
      </div>`;
  }

  function renderTool(id) {
    const t = TOOLS.find(x => x.id === id);
    if (!t) return renderHome();
    app.innerHTML = `
      <div class="wrap tool-page">
        <a class="back" href="#/">← 返回首页</a>
        <div class="tool-head">
          <div class="cat">${t.cat}</div>
          <h1>${t.name}</h1>
          <p>${t.desc}</p>
        </div>
        <div class="panel">
          <div class="icon">${ICONS[CAT_ICON[t.cat] || "misc"]}</div>
          <h2>工具界面建设中</h2>
          <p>页面框架已就位，工具功能即将上线</p>
        </div>
      </div>`;
  }

  function renderAbout() {
    app.innerHTML = `
      <div class="wrap about">
        <h1>关于本站</h1>
        <p>这是一个由个人开发者维护的工具集合站，收录日常工作与开发中自己写的小工具。</p>
        <p>所有工具均在浏览器本地运行，不上传任何数据，无需登录即可使用。</p>
        <p>目前共 ${TOOLS.length} 个工具，持续更新中。</p>
      </div>`;
  }

  function route() {
    const hash = location.hash.replace(/^#/, "") || "/";
    document.querySelectorAll("[data-nav]").forEach(a => {
      a.classList.toggle("active", (hash === "/" && a.dataset.nav === "home") || (hash.startsWith("/about") && a.dataset.nav === "about"));
    });
    if (hash === "/" ) return renderHome();
    if (hash.startsWith("/about")) return renderAbout();
    if (hash.startsWith("/tool/")) return renderTool(hash.split("/")[2]);
    renderHome();
  }

  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
